        let allTools = [];
        let filteredTools = [];

        // ========== التهيئة ==========
        function init() {
            checkGoldStatus();
            allTools = [...SHORTCUT_TOOLS, ...ACTION_TOOLS];
            filteredTools = [...allTools];
            renderTools();
            updateCounts();
        }

        function checkGoldStatus() {
            const key = localStorage.getItem('toolvault_gold_license_v2');
            if (key === 'nourddine_abatal_gold_2026') activateGold();
        }

        function activateGold() {
            isGold = true;
            document.getElementById('goldBadge').classList.add('active');
            document.getElementById('upgradeBanner').style.display = 'none';
            updateCounts();
            renderTools();
        }

        function updateCounts() {
            const sc = allTools.filter(t => t.type === 'shortcut').length;
            const ac = allTools.filter(t => t.type === 'action').length;
            document.getElementById('shortcutCount').textContent = sc;
            document.getElementById('actionCount').textContent = ac;
            document.getElementById('totalCount').textContent = isGold ? '1000' : (sc + ac);
        }

        // ========== عرض الأدوات ==========
        function renderTools() {
            const container = document.getElementById('toolsList');
            const query = document.getElementById('searchInput').value.toLowerCase();

            filteredTools = allTools.filter(tool => {
                const matchesTab = tool.type === currentTab;
                const matchesFilter = currentFilter === 'all' || 
                    tool.category === currentFilter ||
                    (currentFilter === 'verified' && tool.verified);
                const matchesSearch = !query || 
                    tool.name.toLowerCase().includes(query) ||
                    tool.desc.toLowerCase().includes(query) ||
                    tool.category.toLowerCase().includes(query);
                return matchesTab && matchesFilter && matchesSearch;
            });

            container.innerHTML = '';

            if (filteredTools.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div class="icon">🔍</div>
                        <p>لا توجد نتائج</p>
                        <p style="font-size:0.8em;">جرب كلمة بحث أخرى أو فلتر مختلف</p>
                    </div>
                `;
                return;
            }

            filteredTools.forEach(tool => {
                const a = document.createElement('a');
                a.href = tool.url;
                a.target = '_blank';
                a.className = `tool-card ${tool.type === 'shortcut' ? 'red' : 'green'} ${tool.verified ? 'verified' : ''}`;
                a.onclick = (e) => {
                    showToast(tool.type === 'action' ? '⚡ جاري التنفيذ...' : '🔗 تم الفتح');
                    if (tool.url.startsWith('intent://') && !navigator.userAgent.includes('Android')) {
                        e.preventDefault();
                        showToast('⚠️ هذه الميزة لنظام أندرويد فقط');
                    }
                };

                a.innerHTML = `
                    <div class="tool-left">
                        <div class="tool-name">${tool.verified ? '✅ ' : ''}${tool.name}</div>
                        <div class="tool-desc">${tool.desc}</div>
                        <div class="tool-meta">
                            <span class="tool-tag ${tool.type === 'shortcut' ? 'tag-red' : 'tag-green'}">
                                ${tool.type === 'shortcut' ? 'اختصار' : 'أمر مباشر'}
                            </span>
                            ${tool.verified ? '<span class="tag-verified">✔️ يعمل</span>' : ''}
                        </div>
                    </div>
                    <span class="tool-btn ${tool.type === 'shortcut' ? 'btn-red' : 'btn-green'}">
                        ${tool.type === 'shortcut' ? '🔗 فتح' : '⚡ تنفيذ'}
                    </span>
                `;
                container.appendChild(a);
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabShortcut').classList.toggle('active', tab === 'shortcut');
            document.getElementById('tabAction').classList.toggle('active', tab === 'action');
            renderTools();
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTools();
        }

        // ========== دفع ==========
        function showPayment() {
            const choice = confirm(
                '💳 ToolVault Pro ذهبي - 9.99$\n\n' +
                '• 1000 أداة كاملة\n• تحديثات أسبوعية\n• دعم مباشر\n\n' +
                'OK = Ko-fi | Cancel = PayPal'
            );
            if (choice) window.open('https://ko-fi.com/nourddineabatal', '_blank');
            else window.open('https://www.paypal.com/paypalme/nourddineabatal06', '_blank');
            
            setTimeout(() => {
                const key = prompt('🔑 كود التفعيل:\n(للتجربة: trial)');
                if (key === 'nourddine_abatal_gold_2026' || key === 'trial') {
                    localStorage.setItem('toolvault_gold_license_v2', 'nourddine_abatal_gold_2026');
                    activateGold();
                    alert('✅ تم التفعيل!\nشكراً Nourddine Abatal');
                } else if (key) alert('❌ خطأ\nnourddineabatal06@gmail.com');
            }, 2000);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        document.addEventListener('DOMContentLoaded', init);
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
